type WeatherCurrent @table @export {
	id: ID @primaryKey
	sectionId: ID @indexed
	timestamp: String
	tempF: Float
	condition: String
	weatherCode: Int
	humidityPct: Float
	windMph: Float
	uvIndex: Float
	tempHighF: Float
	tempLowF: Float
}

type WeatherHourly @table @export {
	id: ID @primaryKey
	sectionId: ID @indexed
	timestamp: String @indexed
	tempF: Float
	condition: String
	weatherCode: Int
}

type WeatherForecast @table @export {
	id: ID @primaryKey
	sectionId: ID @indexed
	section: RiverSection @relationship(from: "sectionId")
	date: String @indexed
	tempHighF: Float
	tempLowF: Float
	sky: String
	precipProb: Float
	precipIn: Float
	precipSnowIn: Float
	snowOrRain: String
	windMph: Float
	weatherCode: Int
	condition: String
	source: String
	capturedAt: String
}

type WeatherObservation @table @export {
	id: ID @primaryKey
	sectionId: ID @indexed
	section: RiverSection @relationship(from: "sectionId")
	date: String @indexed
	tempHighF: Float
	tempLowF: Float
	precipIn: Float
	precipSnowIn: Float
	windMph: Float
	weatherCode: Int
	source: String
	capturedAt: String
}
