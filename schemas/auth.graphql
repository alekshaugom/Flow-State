type WaitlistUser @table @export {
	id: ID @primaryKey
	email: String @indexed
	name: String
	firstName: String
	lastName: String
	avatarUrl: String
	provider: String
	status: String @indexed
	createdAt: String @indexed
	grantedAt: String
	grantedBy: String
	lastLoginAt: String
	role: String @indexed
}
