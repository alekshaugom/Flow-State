# yaml-language-server: $schema=./node_modules/harper/config-app.schema.json

# Colorado River Flow Forecasting App
# Built on Harper — database, API, and web server in one

loadEnv:
  files: '.env'

rest: true

graphqlSchema:
  files: 'schemas/*.graphql'

jsResource:
  files: 'resources/*.ts'

static:
  files: 'web/*'

'@harperfast/oauth':
  package: '@harperfast/oauth'
  redirectUri: ${OAUTH_REDIRECT_BASE_URI}
  providers:
    google:
      clientId: ${OAUTH_GOOGLE_CLIENT_ID}
      clientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET}
  postLoginRedirect: '/login'
