<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C7DA0"/>
    </marker>
    <marker id="ar5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2693A"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#F7F4EE"/>

  <text x="600" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1A2436">Harper, twice over.</text>
  <text x="600" y="86" text-anchor="middle" font-size="14" fill="#6B7280">The same store holds what the app observes and what the project has learned.</text>

  <!-- Center: Harper runtime -->
  <rect x="430" y="240" width="340" height="280" rx="16" fill="#FFFFFF" stroke="#1A2436" stroke-width="2.5"/>
  <text x="600" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#2C7DA0" letter-spacing="2">SINGLE RUNTIME</text>
  <text x="600" y="312" text-anchor="middle" font-size="26" font-weight="700" fill="#1A2436">Harper</text>
  <text x="600" y="334" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">database · REST · static host</text>

  <line x1="470" y1="358" x2="730" y2="358" stroke="#E8DDD0" stroke-width="1"/>

  <text x="450" y="380" font-size="11" font-weight="700" fill="#1A2436" letter-spacing="1">APP TABLES</text>
  <text x="450" y="398" font-size="12" fill="#1A2436">GaugeReading · SnowpackReading</text>
  <text x="450" y="414" font-size="12" fill="#1A2436">DamRelease · FlowBand · River</text>

  <text x="450" y="446" font-size="11" font-weight="700" fill="#D2693A" letter-spacing="1">LEARNING TABLES</text>
  <text x="450" y="464" font-size="12" fill="#1A2436">ForecastInput · ForecastAccuracy</text>
  <text x="450" y="480" font-size="12" fill="#1A2436">SectionHeuristic · ForecastRun</text>

  <text x="600" y="508" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">same indexes · same queries · same REST</text>

  <!-- LEFT: Inputs (data sources) -->
  <text x="180" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#2C7DA0" letter-spacing="2">DATA IN</text>

  <g>
    <rect x="80" y="190" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="180" y="217" text-anchor="middle" font-size="13" fill="#1A2436">USGS gauges (15 min)</text>

    <rect x="80" y="246" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="180" y="273" text-anchor="middle" font-size="13" fill="#1A2436">SNOTEL snowpack (6 h)</text>

    <rect x="80" y="302" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="180" y="329" text-anchor="middle" font-size="13" fill="#1A2436">BOR releases · CDSS</text>

    <rect x="80" y="358" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="180" y="385" text-anchor="middle" font-size="13" fill="#1A2436">NOAA gridpoint forecasts</text>
  </g>

  <text x="180" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#D2693A" letter-spacing="2">LEARNING IN</text>

  <g>
    <rect x="80" y="460" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="180" y="487" text-anchor="middle" font-size="13" fill="#1A2436">forecast inputs (snapshot)</text>

    <rect x="80" y="516" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="180" y="543" text-anchor="middle" font-size="13" fill="#1A2436">observed vs. predicted</text>

    <rect x="80" y="572" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="180" y="599" text-anchor="middle" font-size="13" fill="#1A2436">tuned heuristic weights</text>

    <rect x="80" y="628" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="180" y="655" text-anchor="middle" font-size="13" fill="#1A2436">.plans/ markdown (git)</text>
  </g>

  <!-- Arrows from inputs to Harper -->
  <line x1="285" y1="212" x2="425" y2="295" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="285" y1="268" x2="425" y2="320" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="285" y1="324" x2="425" y2="345" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="285" y1="380" x2="425" y2="370" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>

  <line x1="285" y1="482" x2="425" y2="430" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="285" y1="538" x2="425" y2="455" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="285" y1="594" x2="425" y2="480" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="285" y1="650" x2="425" y2="505" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>

  <!-- RIGHT: Outputs (who reads) -->
  <text x="1020" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#2C7DA0" letter-spacing="2">FOR HUMANS</text>

  <g>
    <rect x="920" y="190" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="1020" y="217" text-anchor="middle" font-size="13" fill="#1A2436">dashboard, maps, charts</text>

    <rect x="920" y="246" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="1020" y="273" text-anchor="middle" font-size="13" fill="#1A2436">"Runnable (technical)"</text>

    <rect x="920" y="302" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="1020" y="329" text-anchor="middle" font-size="13" fill="#1A2436">interpretive summaries</text>

    <rect x="920" y="358" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="1.5"/>
    <text x="1020" y="385" text-anchor="middle" font-size="13" fill="#1A2436">trip planning details</text>
  </g>

  <text x="1020" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#D2693A" letter-spacing="2">FOR FUTURE SESSIONS</text>

  <g>
    <rect x="920" y="460" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="1020" y="487" text-anchor="middle" font-size="13" fill="#1A2436">"what missed last week?"</text>

    <rect x="920" y="516" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="1020" y="543" text-anchor="middle" font-size="13" fill="#1A2436">"why this heuristic?"</text>

    <rect x="920" y="572" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="1020" y="599" text-anchor="middle" font-size="13" fill="#1A2436">"what's already known?"</text>

    <rect x="920" y="628" width="200" height="44" rx="8" fill="#FBEDE3" stroke="#D2693A" stroke-width="1.5"/>
    <text x="1020" y="655" text-anchor="middle" font-size="13" fill="#1A2436">"what's next on the queue?"</text>
  </g>

  <!-- Arrows from Harper to outputs -->
  <line x1="775" y1="295" x2="915" y2="212" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="775" y1="320" x2="915" y2="268" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="775" y1="345" x2="915" y2="324" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>
  <line x1="775" y1="370" x2="915" y2="380" stroke="#2C7DA0" stroke-width="1.5" marker-end="url(#ar5a)" opacity="0.7"/>

  <line x1="775" y1="430" x2="915" y2="482" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="775" y1="455" x2="915" y2="538" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="775" y1="480" x2="915" y2="594" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>
  <line x1="775" y1="505" x2="915" y2="650" stroke="#D2693A" stroke-width="1.5" marker-end="url(#ar5b)" opacity="0.7"/>

  <!-- Footer -->
  <text x="600" y="730" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">Observations and learning are the same kind of data. Indexed rows. Queryable. Versioned.</text>
</svg>
