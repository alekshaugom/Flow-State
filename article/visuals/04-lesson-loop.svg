<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="larr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A2436"/>
    </marker>
    <marker id="larrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2693A"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#F7F4EE"/>

  <text x="600" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1A2436">How the project stops re-learning.</text>
  <text x="600" y="86" text-anchor="middle" font-size="14" fill="#6B7280">An incident becomes a lesson. A recurring lesson becomes a principle.</text>

  <!-- Stage 1: Incident -->
  <g>
    <rect x="80" y="180" width="240" height="276" rx="12" fill="#FFFFFF" stroke="#D2693A" stroke-width="2"/>
    <rect x="80" y="180" width="240" height="40" rx="12" fill="#D2693A"/>
    <text x="200" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F4EE" letter-spacing="1.5">1. INCIDENT</text>

    <text x="100" y="248" font-size="13" font-weight="700" fill="#1A2436">Real example, slice 01:</text>

    <text x="100" y="276" font-size="12" fill="#1A2436">Sections sporadically</text>
    <text x="100" y="293" font-size="12" fill="#1A2436">return flow.current: null</text>
    <text x="100" y="310" font-size="12" fill="#1A2436">after deploy.</text>

    <text x="100" y="338" font-size="12" fill="#6B7280" font-style="italic">Two stacked Harper</text>
    <text x="100" y="354" font-size="12" fill="#6B7280" font-style="italic">gotchas, hours lost.</text>

    <text x="100" y="392" font-size="11" fill="#D2693A" font-weight="700">SYMPTOM →</text>
    <text x="100" y="408" font-size="11" fill="#1A2436">"my changes deployed</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="335" y1="300" x2="395" y2="300" stroke="#1A2436" stroke-width="2" marker-end="url(#larr)"/>
  <text x="365" y="290" text-anchor="middle" font-size="11" fill="#6B7280">write up</text>

  <!-- Stage 2: Lesson file -->
  <g>
    <rect x="410" y="160" width="380" height="380" rx="12" fill="#FFFFFF" stroke="#1A2436" stroke-width="2"/>
    <rect x="410" y="160" width="380" height="40" rx="12" fill="#1A2436"/>
    <text x="600" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F4EE" letter-spacing="1.5">2. LESSON  ·  L004</text>

    <text x="430" y="226" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#2C7DA0">lessons/L004-harper-static-import-...md</text>

    <line x1="430" y1="240" x2="770" y2="240" stroke="#E8DDD0" stroke-width="1"/>

    <text x="430" y="264" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">WRONG ASSUMPTION</text>
    <text x="430" y="282" font-size="12" fill="#1A2436">"Dynamic import of tables works the same."</text>

    <text x="430" y="310" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">HOW IT MANIFESTED</text>
    <text x="430" y="328" font-size="12" fill="#1A2436">Filtered search returns 0 rows for a</text>
    <text x="430" y="344" font-size="12" fill="#1A2436">window after a rolling restart.</text>

    <text x="430" y="372" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">THE RIGHT MODEL</text>
    <text x="430" y="390" font-size="12" fill="#1A2436">Static-import tables; cache small refs</text>
    <text x="430" y="406" font-size="12" fill="#1A2436">in memory; fall back gracefully.</text>

    <text x="430" y="434" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">RECOGNITION PATTERN</text>
    <text x="430" y="452" font-size="12" fill="#1A2436">"Production logs show empty result</text>
    <text x="430" y="468" font-size="12" fill="#1A2436">on a query that worked locally."</text>

    <text x="430" y="496" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">MITIGATION</text>
    <text x="430" y="514" font-size="12" fill="#1A2436">Cache + GaugeSnapshot fallback.</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="805" y1="300" x2="865" y2="300" stroke="#D2693A" stroke-width="2" marker-end="url(#larrO)"/>
  <text x="835" y="290" text-anchor="middle" font-size="11" fill="#D2693A">if recurs</text>

  <!-- Stage 3: Vision -->
  <g>
    <rect x="880" y="180" width="240" height="276" rx="12" fill="#FFFFFF" stroke="#D2693A" stroke-width="2"/>
    <rect x="880" y="180" width="240" height="40" rx="12" fill="#D2693A"/>
    <text x="1000" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F4EE" letter-spacing="1.5">3. PROMOTION</text>

    <text x="900" y="248" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#2C7DA0">vision/data-model-philosophy.md</text>

    <line x1="900" y1="262" x2="1100" y2="262" stroke="#E8DDD0" stroke-width="1"/>

    <text x="900" y="288" font-size="13" font-weight="700" fill="#1A2436">A new paragraph:</text>

    <text x="900" y="316" font-size="12" fill="#1A2436">"For small reference tables,</text>
    <text x="900" y="334" font-size="12" fill="#1A2436">prefer in-memory cache over</text>
    <text x="900" y="352" font-size="12" fill="#1A2436">post-restart indexed search.</text>
    <text x="900" y="370" font-size="12" fill="#1A2436">See L004."</text>

    <text x="900" y="408" font-size="11" font-style="italic" fill="#6B7280">The principle holds across</text>
    <text x="900" y="424" font-size="11" font-style="italic" fill="#6B7280">all future slices.</text>
  </g>

  <!-- Loop arrow: future session reads vision before starting -->
  <path d="M 1000 472 Q 1000 612, 600 612 Q 200 612, 200 472" fill="none" stroke="#2C7DA0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#larr)"/>
  <text x="600" y="642" text-anchor="middle" font-size="13" fill="#2C7DA0" font-weight="600">future session reads vision + lessons before starting</text>

  <!-- Bottom footer -->
  <text x="600" y="680" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">Mistakes get filed, not forgotten. Patterns get promoted, not buried.</text>
</svg>
