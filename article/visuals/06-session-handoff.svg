<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A2436"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#F7F4EE"/>

  <text x="600" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1A2436">How a session picks up cold.</text>
  <text x="600" y="86" text-anchor="middle" font-size="14" fill="#6B7280">Every loop starts with the same five steps. Memory lives in files, not in chat.</text>

  <!-- Center label -->
  <circle cx="600" cy="420" r="92" fill="#1A2436"/>
  <text x="600" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F4EE" letter-spacing="2">SESSION</text>
  <text x="600" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F4EE" letter-spacing="2">LIFECYCLE</text>
  <text x="600" y="454" text-anchor="middle" font-size="11" fill="#2C7DA0" font-style="italic">cold start →</text>
  <text x="600" y="470" text-anchor="middle" font-size="11" fill="#2C7DA0" font-style="italic">clean handoff</text>

  <!-- 5 nodes around the circle -->
  <!-- Position math: center 600,420. r ≈ 250. Angles for 5 nodes (starting top, clockwise):
       72° apart: top (90°), top-right (18°), bottom-right (-54°), bottom-left (-126°), top-left (162°) -->

  <!-- 1. ENTER (top) -->
  <g>
    <rect x="490" y="160" width="220" height="110" rx="12" fill="#FFFFFF" stroke="#1A2436" stroke-width="2"/>
    <circle cx="510" cy="180" r="14" fill="#1A2436"/>
    <text x="510" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F4EE">1</text>
    <text x="535" y="186" font-size="14" font-weight="700" fill="#1A2436">ENTER</text>
    <text x="510" y="216" font-size="12" fill="#1A2436">Empty context window.</text>
    <text x="510" y="234" font-size="12" fill="#1A2436">No knowledge of</text>
    <text x="510" y="252" font-size="12" fill="#1A2436">prior sessions.</text>
  </g>

  <!-- 2. ORIENT (top right) -->
  <g>
    <rect x="900" y="290" width="240" height="160" rx="12" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="2"/>
    <circle cx="920" cy="310" r="14" fill="#2C7DA0"/>
    <text x="920" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F4EE">2</text>
    <text x="945" y="316" font-size="14" font-weight="700" fill="#1A2436">ORIENT</text>
    <text x="920" y="346" font-size="12" fill="#1A2436">▪ Read README</text>
    <text x="920" y="364" font-size="12" fill="#1A2436">▪ Read ROADMAP</text>
    <text x="920" y="382" font-size="12" fill="#1A2436">▪ Open active slice</text>
    <text x="920" y="400" font-size="12" fill="#1A2436">▪ Scan lesson titles</text>
    <text x="920" y="418" font-size="12" fill="#1A2436">▪ Read relevant vision/</text>
    <text x="920" y="436" font-size="11" fill="#6B7280" font-style="italic">5 reads. Then work.</text>
  </g>

  <!-- 3. WORK (bottom right) -->
  <g>
    <rect x="820" y="560" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#1A2436" stroke-width="2"/>
    <circle cx="840" cy="580" r="14" fill="#1A2436"/>
    <text x="840" y="585" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F4EE">3</text>
    <text x="865" y="586" font-size="14" font-weight="700" fill="#1A2436">WORK</text>
    <text x="840" y="616" font-size="12" fill="#1A2436">Follow plan.md.</text>
    <text x="840" y="634" font-size="12" fill="#1A2436">Edit files, run tests,</text>
    <text x="840" y="652" font-size="12" fill="#1A2436">verify acceptance.</text>
    <text x="840" y="670" font-size="11" fill="#6B7280" font-style="italic">Detail is already there.</text>
  </g>

  <!-- 4. RECORD (bottom left) -->
  <g>
    <rect x="140" y="560" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#D2693A" stroke-width="2"/>
    <circle cx="160" cy="580" r="14" fill="#D2693A"/>
    <text x="160" y="585" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F4EE">4</text>
    <text x="185" y="586" font-size="14" font-weight="700" fill="#1A2436">RECORD</text>
    <text x="160" y="616" font-size="12" fill="#1A2436">▪ status.md — dated bullets</text>
    <text x="160" y="634" font-size="12" fill="#1A2436">▪ decisions.md — choices</text>
    <text x="160" y="652" font-size="12" fill="#1A2436">▪ lessons/L### — surprises</text>
    <text x="160" y="670" font-size="11" fill="#6B7280" font-style="italic">Write for the next session.</text>
  </g>

  <!-- 5. HAND OFF (top left) -->
  <g>
    <rect x="60" y="290" width="240" height="160" rx="12" fill="#FFFFFF" stroke="#2C7DA0" stroke-width="2"/>
    <circle cx="80" cy="310" r="14" fill="#2C7DA0"/>
    <text x="80" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F4EE">5</text>
    <text x="105" y="316" font-size="14" font-weight="700" fill="#1A2436">HAND OFF</text>
    <text x="80" y="346" font-size="12" fill="#1A2436">If shipped:</text>
    <text x="80" y="364" font-size="12" fill="#1A2436">▪ Move slice → completed/</text>
    <text x="80" y="382" font-size="12" fill="#1A2436">▪ Promote next slice</text>
    <text x="80" y="400" font-size="12" fill="#1A2436">▪ Expand intent → plan</text>
    <text x="80" y="418" font-size="12" fill="#1A2436">▪ Update ROADMAP</text>
    <text x="80" y="436" font-size="11" fill="#6B7280" font-style="italic">Queue advances.</text>
  </g>

  <!-- Connecting arrows (clockwise curves around the center) -->
  <!-- 1 -> 2 -->
  <path d="M 715 220 Q 880 220, 910 295" fill="none" stroke="#1A2436" stroke-width="1.6" marker-end="url(#ar6)"/>
  <!-- 2 -> 3 -->
  <path d="M 1020 450 Q 1020 540, 940 565" fill="none" stroke="#1A2436" stroke-width="1.6" marker-end="url(#ar6)"/>
  <!-- 3 -> 4 -->
  <path d="M 820 615 Q 600 720, 380 615" fill="none" stroke="#1A2436" stroke-width="1.6" marker-end="url(#ar6)"/>
  <!-- 4 -> 5 -->
  <path d="M 180 560 Q 180 540, 180 450" fill="none" stroke="#1A2436" stroke-width="1.6" marker-end="url(#ar6)"/>
  <!-- 5 -> 1 (closes the loop) -->
  <path d="M 290 295 Q 400 215, 488 215" fill="none" stroke="#1A2436" stroke-width="1.6" marker-end="url(#ar6)"/>

  <!-- Footer -->
  <text x="600" y="745" text-anchor="middle" font-size="13" fill="#6B7280" font-style="italic">No session inherits chat history. Every session inherits the repo.</text>
</svg>
